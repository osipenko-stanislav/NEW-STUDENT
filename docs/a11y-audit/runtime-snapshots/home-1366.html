 .settings-group-card > .settings-row { padding: 16px; }

.course-no-recording { display: flex; align-items: center; gap: 8px; padding: 12px; border-radius: 8px; background: hsl(var(--muted)); font-size: calc(12px * var(--text-scale, 1)); color: hsl(var(--muted-foreground)); }
.course-no-recording svg { width: 16px; height: 16px; flex-shrink: 0; }
.course-empty-results { min-height: 280px; }

.course-lesson-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 0 8px; margin: 20px 0; font-size: calc(12px * var(--text-scale, 1)); color: hsl(var(--muted-foreground)); }
.course-lesson-meta > span { display: flex; align-items: center; gap: 5px; }
.course-lesson-meta svg { width: 14px; height: 14px; }
.course-reader { padding-block: 8px 32px; }
.course-reader-body { margin-inline: auto; font-size: calc(16px * var(--text-scale, 1)); line-height: 1.75; overflow-wrap: anywhere; max-width: min(var(--layout-reading), var(--reading-measure)); }

.course-reader h4 { margin-top: 24px; margin-bottom: 12px; font-size: calc(16px * var(--text-scale, 1)); line-height: 1.5; font-weight: 600; }
.course-reader [id] { scroll-margin-top: 24px; outline: none; }
.course-reader p + p { margin-top: 16px; }

.course-reader ol { list-style-type: decimal; }
.course-reader li + li { margin-top: 8px; }
.course-reader p a, .course-text-link { color: var(--color-blue-text); text-decoration: underline; text-underline-offset: 4px; }
.course-network-figure { margin: 28px 0; }
.course-network-figure img { display: block; width: 100%; height: auto; border-radius: var(--radius); background: var(--color-blue-soft); }
.course-network-figure figcaption { margin-top: 10px; font-size: calc(12px * var(--text-scale, 1)); line-height: 20px; color: hsl(var(--muted-foreground)); }
.course-equation { padding: 20px; margin: 16px 0; border: 1px solid hsl(var(--border)); border-radius: var(--radius); text-align: center; font-size: calc(20px * var(--text-scale, 1)); line-height: 1.4; }
.course-reader blockquote { margin: 24px 0; padding: 4px 0 4px 20px; border-left: 2px solid hsl(var(--border)); color: hsl(var(--muted-foreground)); }
.course-code { max-width: 100%; margin: 24px 0; padding: 20px; overflow-x: auto; border-radius: var(--radius); background: hsl(var(--muted)); font-size: calc(13px * var(--text-scale, 1)); line-height: 1.75; }
.course-lesson-materials { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
.course-lesson-materials li { display: flex; align-items: center; gap: 8px; margin: 0 !important; padding: 12px 0; border-bottom: 1px solid hsl(var(--border)); }
.course-lesson-materials li > a { display: flex; min-width: 0; flex: 1; align-items: center; gap: 12px; }
.course-lesson-materials strong { display: block; font-size: calc(13px * var(--text-scale, 1)); line-height: 20px; font-weight: 500; overflow-wrap: anywhere; }
.course-lesson-materials small { display: block; margin-top: 4px; font-size: calc(11px * var(--text-scale, 1)); line-height: 16px; color: hsl(var(--muted-foreground)); }
.course-lesson-materials li > a:last-child { flex: none; width: 36px; height: 36px; }
.course-embedded-video { position: relative; width: 100%; display: grid; place-items: center; min-height: 280px; aspect-ratio: 16/10; border-radius: var(--radius); overflow: hidden; background: hsl(var(--muted)); }

.course-embedded-video > div { position: relative; min-width: 0; max-width: 100%; display: flex; align-items: center; flex-direction: column; gap: 12px; padding: 20px; text-align: center; }
.course-embedded-video > div > svg { width: 28px; height: 28px; }
.course-embedded-video p { font-size: calc(14px * var(--text-scale, 1)); font-weight: 500; }
.course-embedded-video button { max-width: 100%; height: auto; min-height: 36px; white-space: normal; font-size: calc(12px * var(--text-scale, 1)); }
.course-assignment-card { position: relative; display: flex; align-items: flex-start; gap: 12px; padding: 24px; border: 1px solid hsl(var(--border)); border-radius: var(--radius); overflow: hidden; }
.course-assignment-card > div { min-width: 0; flex: 1; }
.course-assignment-card h3 { font-size: calc(17px * var(--text-scale, 1)); margin: 12px 0; }
.course-assignment-card p { margin-bottom: 16px; color: hsl(var(--muted-foreground)); font-size: calc(12px * var(--text-scale, 1)); line-height: 20px; }
.course-assignment-card > img { width: 100px; height: 120px; -o-object-fit: contain; object-fit: contain; flex-shrink: 0; }
.course-assignment-card button { font-size: calc(12px * var(--text-scale, 1)); }
.course-lesson-navigation { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; padding: 20px 0 8px; }
.course-lesson-navigation button { min-width: 0; height: auto; min-height: 40px; font-size: calc(12px * var(--text-scale, 1)); white-space: normal; text-align: left; }
.course-mobile-toc { display: none; }
.course-info-dialog { width: calc(100% - 32px); max-width: 640px; max-height: calc(100dvh - 32px); overflow-y: auto; overscroll-behavior: contain; border-radius: var(--radius); }
.course-dialog-body { display: flex; min-width: 0; flex-direction: column; gap: 20px; font-size: calc(14px * var(--text-scale, 1)); line-height: 1.6; }
.course-dialog-body h3 { font-size: calc(16px * var(--text-scale, 1)); font-weight: 500; }
.course-syllabus-list { display: flex; flex-direction: column; gap: 4px; }
.course-syllabus-list button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px; border-radius: 8px; text-align: left; font-size: calc(13px * var(--text-scale, 1)); }
.course-syllabus-list button:hover { background: hsl(var(--muted)); }
.course-syllabus-list span { color: hsl(var(--muted-foreground)); width: 20px; flex-shrink: 0; }
.course-syllabus-list svg { width: 14px; height: 14px; margin-left: auto; flex-shrink: 0; color: var(--color-blue-text); }
.course-detail-list { display: flex; flex-direction: column; }
.course-detail-list > div { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 12px 0; border-top: 1px solid hsl(var(--border)); }
.course-detail-list dt { color: hsl(var(--muted-foreground)); }
.course-detail-list dd { display: flex; align-items: flex-start; gap: 8px; min-width: 0; overflow-wrap: anywhere; }
.course-detail-list dd svg { flex-shrink: 0; margin-top: 2px; }
.course-dialog-note { color: hsl(var(--muted-foreground)); font-size: calc(13px * var(--text-scale, 1)); }
.course-chat-preview { display: flex; align-items: flex-start; gap: 12px; }
.course-chat-avatar { display: grid; place-items: center; width: 36px; height: 36px; flex-shrink: 0; border-radius: 50%; background: var(--color-blue-soft); color: var(--color-blue-text); font-size: calc(11px * var(--text-scale, 1)); }
.course-chat-preview strong { display: block; font-size: calc(13px * var(--text-scale, 1)); }
.course-chat-preview > div > span { color: hsl(var(--muted-foreground)); font-size: calc(11px * var(--text-scale, 1)); }
.course-chat-preview p { margin-top: 12px; }
.course-dialog-actions { display: flex; flex-wrap: wrap; gap: 10px; }
.course-dialog-actions button, .course-dialog-actions a { max-width: 100%; height: auto; min-height: 36px; white-space: normal; }
.course-recording-dialog { width: calc(100% - 32px); max-width: 680px; max-height: calc(100dvh - 32px); overflow-y: auto; border-radius: var(--radius); }
.course-video-unavailable { display: flex; min-height: 260px; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; border-radius: var(--radius); background: hsl(var(--muted)); text-align: center; }
.course-video-unavailable > svg { width: 32px; height: 32px; color: hsl(var(--muted-foreground)); }
.course-video-unavailable h3 { font-size: calc(18px * var(--text-scale, 1)); font-weight: 500; }
.course-video-unavailable p { max-width: 45ch; font-size: calc(13px * var(--text-scale, 1)); line-height: 22px; color: hsl(var(--muted-foreground)); }
.course-other-overview { display: flex; flex-direction: column; align-items: flex-start; gap: 20px; padding: 32px; }
.course-other-overview h2 { font-size: calc(22px * var(--text-scale, 1)); font-weight: 500; }
.course-other-overview p { font-size: calc(14px * var(--text-scale, 1)); line-height: 24px; color: hsl(var(--muted-foreground)); }
@container (max-width: 1000px) {
  .course-catalog-header { padding: 0 0 var(--component-gap); }
  .course-reader { padding: 8px 0 32px; }
  .course-recording-filters { grid-template-columns: 1fr; }
}
@container course-surface (max-width: 1055px) {
  .course-mobile-program-trigger { display: flex; width: 100%; margin-bottom: 12px; }
  .course-widgets .course-program-link { display: none; }
  .course-layout { grid-template-columns: minmax(0, 1fr); --layout-rail: 0px; }
  .course-widgets { position: static; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; }
  .course-widgets .course-toc { display: none; }
  .course-mobile-toc { display: block; padding: 16px; margin-bottom: 16px; border-radius: var(--radius); border: 1px solid hsl(var(--border)); background: hsl(var(--background)); }
  .course-mobile-toc summary { display: flex; align-items: center; gap: 8px; cursor: pointer; list-style: none; font-size: calc(13px * var(--text-scale, 1)); }
  .course-mobile-toc summary svg { width: 16px; height: 16px; }
  .course-mobile-toc summary svg:last-child { margin-left: auto; }
  .course-mobile-toc nav { padding-top: 12px; }
  .course-mobile-toc a { display: block; padding: 8px; border-radius: 6px; font-size: calc(13px * var(--text-scale, 1)); color: hsl(var(--muted-foreground)); }
  .course-mobile-toc a[aria-current="location"] { background: hsl(var(--accent)); color: hsl(var(--accent-foreground)); }
  .course-recording-filters { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@container course-surface (min-width: 501px) and (max-width: 680px) {
  .course-widgets { grid-template-columns: minmax(0, 1fr); }
}
@container (max-width: 500px) {
  .course-catalog-header { padding: 0 0 var(--component-gap); }
  .course-filter-list { gap: 6px; }
  .course-filter-list button { height: 32px; padding-inline: 12px; font-size: calc(12px * var(--text-scale, 1)); }
  .course-catalog-caption { margin-top: 20px; gap: 4px; }
  .course-grid { grid-template-columns: minmax(0, 1fr); gap: 16px;  margin-top: 0; }

  .course-area-icon { width: 20px; height: 20px; }
  .course-area-icon svg { width: 14px; height: 14px; }
